<!DOCTYPE html>
<html>
  <body>
    <h2 align="center">Student Information Form</h2>
    <h5 align="center">Senior High School Enrollment --- Grade 11</h5>
    <h4>Personal Information</h4>
    <label><b>First Name</b><br><input type="text" placeholder="Enter First Name" required><label><b>Last Name</b></label><input type="text" placeholder="Enter Last Name" required><label><b>Middle Name</b></label><input type="text" placeholder="Enter Middle Name" required><br><br>
    <label><b>Email</b></label><input type="email" placeholder="ex. you@example.com" required><label><b>Password</b></label><input type="password" placeholder="Create a password" required><br><br>
    <label><b>Age</b></label><input type="text" placeholder="e.g. 16" required><label><b>Birthday</b></label><input type="text" placeholder="dd/mm/yyyy" required><br><br>
    <label><b>Contact Number</b></label><input type="text" placeholder="09XXXXXXXXX" required><br><br>
    <h4>Student Information</h4><br>
    <label><b>Student ID</b></label><input type="text" placeholder="e.g. 2526M00242" required>
    <label><b>Birthday</b></label><input type="text" placeholder="dd/mm/yyyy" required><br><br>
    <label><b>Grade Level</b></label><select><option>Select grade level</option><option>11</option><option>12</option><option>College</option></select><label><b>Strand</b></label><select><option>Select strand</option><option>CPT</option><option>HA</option><option>HTM</option><option>ENGR</option><option>SSM</option><option>BMA</option><option>CAH</option></select>
    <h4><b>ADDITIONAL INFORMATION</b></h4>
    <label><b>Gender</b></label><br><input type="radio" name="Gender"> Male</label><label><input type="radio" name="Gender"> Female</label><label><input type="radio" name="Gender"> Prefer not to say<br><br>
    <label><b>Hobbies</b></label>
      <div class="group">
        <label><input type="checkbox"> Reading</label>
        <label><input type="checkbox"> Coding</label>
        <label><input type="checkbox"> Playing Sports</label>
        <label><input type="checkbox"> Watching Movies</label>
        <label><input type="checkbox"> Playing Games</label>
        <label><input type="checkbox"> Music</label>
      </div>
      <h4><b>Complete Address</b></h4>
      <textarea rows="5" cols="80">House No., Street, Barangay, City/Municipality, Province</textarea>
      <p>Maximum of 250 characters<p>
      <button>Submit</button><br>
      <button type="reset">reset</button>
  </body>
</html>
